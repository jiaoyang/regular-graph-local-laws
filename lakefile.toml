name = "regular_graph_local_laws"
version = "0.1.0"
defaultTargets = ["LocalLaw", "SpectralConsequences"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c44e0c8ee63ca166450922a373c7409c5d26b00b"

[[lean_lib]]
name = "LocalLaw"
roots = ["LocalLaw"]
globs = ["LocalLaw.+"]

[[lean_lib]]
name = "SpectralConsequences"
roots = ["SpectralConsequences"]
globs = ["SpectralConsequences.+"]
